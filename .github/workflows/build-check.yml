name: Build Release (Subagent)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 发布 Release 需要写权限

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # web 模块的 preBuild 会执行 `pnpm run build` 构建前端，必须准备好 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 签名 + 配置准备：
      # 1) 解码 base64 的 keystore（仓库里存的是文本 .b64，避免二进制传输）。
      #    注意：signingConfig 的 storeFile 相对路径基于 app/ 模块目录解析，故放到 app/keystore/。
      # 2) 写入 google-services.json 占位（匹配 subagent 包名，仅用于编译）
      # 3) 写入 local.properties 签名配置
      - name: Prepare keystore & config
        run: |
          mkdir -p app/keystore
          base64 -d keystore/subagent-release.p12.b64 > app/keystore/subagent-release.p12
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rikkahub-build-check",
              "storage_bucket": "rikkahub-build-check.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.linklink256.rikkahub"
                  },
                  "client_id": "android:me.linklink256.rikkahub"
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": {
                    "package_name": "me.linklink256.rikkahub.debug"
                  },
                  "client_id": "android:me.linklink256.rikkahub.debug"
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ]
          }
          EOF
          cat > local.properties << 'EOF'
          storeFile=keystore/subagent-release.p12
          storePassword=subagent123
          keyAlias=subagent
          keyPassword=subagent123
          EOF

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-subagent-release-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 发布为 Prerelease，提供公开直链下载（无需登录）
      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: subagent-release
          name: RikkaHub Subagent Release
          prerelease: true
          body: |
            RikkaHub + Subagent 扩展（独立签名 / 独立包名 `me.linklink256.rikkahub`，可与原版共存）

            > ⚠️ 开发版本，可能不稳定，仅供测试。子代理功能：扩展管理 → 子代理。
          files: app/build/outputs/apk/release/*.apk

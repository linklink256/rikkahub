name: Tablet Titles 195
on:
  push:
    branches: [tablet-release-20261028]
    paths: [.github/workflows/tablet-titles-195.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tablet-titles-195
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Apply audited title-list fix
        env:
          PATCH_URL: http://117.55.230.183/.well-known/acme-challenge/rikkahub-titles-a9df37e099fd21ac7c98555b/titles.patch.gz
          PATCH_SHA256: 8a4cba25ab1b04071143651dd98abf3c61ddc0cbfdba3e509640c2f456af20d66
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$PATCH_URL" -o /tmp/titles.patch.gz
          echo "$PATCH_SHA256  /tmp/titles.patch.gz" | sha256sum -c -
          gzip -dc /tmp/titles.patch.gz > /tmp/titles.patch
          git apply --check /tmp/titles.patch
          git apply /tmp/titles.patch
          grep -q 'versionCode = 195' app/build.gradle.kts
          test ! -e local.properties
          test ! -d results
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src app/build.gradle.kts docs/AGENT-TEAM-TITLES-20261028.md
          git commit -m 'fix(agent-team): title-only member lists and teammate title model, version195'
          git push origin HEAD:tablet-release-20261028
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK packages
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Web dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile
      - name: Build optimized unsigned release
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleGithubRelease -PtabletUnsigned=true --no-daemon --no-parallel --max-workers=2 -Dorg.gradle.jvmargs='-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - name: Package local-signing handoff
        run: |
          mkdir -p /tmp/handoff
          cp app/build/outputs/apk/github/release/*arm64*.apk /tmp/handoff/
          cp app/build/outputs/mapping/githubRelease/mapping.txt /tmp/handoff/
          git rev-parse HEAD > /tmp/handoff/SOURCE_COMMIT.txt
          cd /tmp/handoff
          sha256sum *.apk > SHA256SUMS
          zip -q /tmp/tablet-titles-195-unsigned.zip ./*
      - name: Publish unsigned handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tablet-titles-195-handoff >/dev/null 2>&1 || gh release create tablet-titles-195-handoff --target tablet-release-20261028 --prerelease --title 'Tablet 195 unsigned handoff — not final APK' --notes 'Audited title-list fix. Unsigned build for private local signing; no user data or signing keys.'
          gh release upload tablet-titles-195-handoff /tmp/tablet-titles-195-unsigned.zip --clobber

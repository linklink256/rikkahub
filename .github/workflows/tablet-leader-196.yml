name: Tablet UI validation only
on:
  push:
    branches: [tablet-release-20261028]
    paths: [.github/workflows/tablet-leader-196.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: tablet-leader-196
  cancel-in-progress: true
jobs:
  stop-packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel prior APK build as requested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/linklink256/rikkahub/actions/runs/40609968032/cancel || true
          echo 'APK generation stopped. Further changes are source/validation only.'

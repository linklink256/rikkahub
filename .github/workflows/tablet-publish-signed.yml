name: Publish Signed Tablet Release
on:
  push:
    branches: [tablet-release-20261028]
    paths: [.github/workflows/tablet-publish-signed.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download public signed artifacts and verify APK
        env:
          BASE_URL: http://117.55.230.183/.well-known/acme-challenge/rikkahub-tablet-c2b88e38dd0cee9ba1886da6
        run: |
          set -euo pipefail
          mkdir publish
          cd publish
          for f in RikkaHub-Tablet-3.1.1-arm64-release.apk mapping.txt.gz RELEASE-NOTES.md SHA256SUMS; do
            curl --fail --location --retry 3 "$BASE_URL/$f" -o "$f"
          done
          echo '0e66c59421ff6de8ea80c7071374221e883f2efac7e79b7169e76dea5311ff07  RikkaHub-Tablet-3.1.1-arm64-release.apk' | sha256sum -c -
          sha256sum -c SHA256SUMS
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs RikkaHub-Tablet-3.1.1-arm64-release.apk | tee SIGNATURE.txt
          grep -q '12e3aada3cf3cc814f35d15d26c9569c6aa9d19a3e0d25bdcad5a09c5ba086b4' SIGNATURE.txt
      - name: Publish final signed prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tablet-v3.1.1-20261028
          target_commitish: 482bc7ca655b7bb09ae89c7c8996a2c3c1f2a9e3
          name: 'RikkaHub Tablet 3.1.1 · ARM64 · 新包名新签名'
          prerelease: true
          body_path: publish/RELEASE-NOTES.md
          files: |
            publish/RikkaHub-Tablet-3.1.1-arm64-release.apk
            publish/SHA256SUMS
            publish/SIGNATURE.txt
            publish/RELEASE-NOTES.md
            publish/mapping.txt.gz
      - name: Remove only this build's temporary handoff releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tablet-build-handoff-20261028 --yes || true
          gh release delete tablet-build-diagnostics-20261028 --yes || true

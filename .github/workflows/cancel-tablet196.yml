name: Stop Tablet196 build
on:
  push:
    branches: [tablet-release-20261028]
    paths: [.github/workflows/cancel-tablet196.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel pending Tablet196 build only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: linklink256/rikkahub
        run: |
          set -euo pipefail
          for status in queued in_progress waiting requested pending; do
            for id in $(gh api "repos/$GH_REPO/actions/workflows/tablet-leader-196.yml/runs?status=$status&per_page=20" --jq '.workflow_runs[].id'); do
              gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" || gh api --method POST "repos/$GH_REPO/actions/runs/$id/force-cancel"
              echo "Cancellation requested for Tablet196 run $id"
            done
          done
